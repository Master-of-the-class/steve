<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur de choix</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #222;
    }

    header {
        background: #222;
        color: white;
        padding: 15px 20px;
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 24px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        background: white;
        border-bottom: 1px solid #ddd;
        justify-content: center;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 18px;
        font-size: 15px;
        cursor: pointer;
        background: #444;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    #readyButton {
        background: #198754;
    }

    #editButton {
        background: #0d6efd;
    }

    #restartButton {
        background: #dc3545;
    }

    #resultsButton {
        background: #6f42c1;
    }

    #saveButton {
        background: #198754;
    }

    #loadButton {
        background: #0d6efd;
    }

    #resetButton {
        background: #8b0000;
    }

    .add-choice {
        display: flex;
        gap: 8px;
        padding: 15px;
        background: white;
        justify-content: center;
    }

    #choiceInput {
        width: 300px;
        max-width: 70%;
        padding: 11px;
        border: 1px solid #bbb;
        border-radius: 8px;
        font-size: 16px;
    }

    #addButton {
        background: #198754;
    }

    #status {
        text-align: center;
        padding: 10px;
        font-weight: bold;
        min-height: 40px;
    }

    #board {
        position: relative;
        margin: 15px;
        min-height: 600px;

        background:
            linear-gradient(#ddd 1px, transparent 1px),
            linear-gradient(90deg, #ddd 1px, transparent 1px);

        background-size: 25px 25px;

        border: 2px solid #aaa;
        border-radius: 10px;
        overflow: hidden;
    }

    .choice {
        position: absolute;

        width: 170px;
        min-height: 100px;

        padding: 15px;

        background: white;
        border: 3px solid #555;
        border-radius: 12px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        user-select: none;
        cursor: grab;

        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);

        transition:
            background-color 0.1s,
            border-color 0.1s,
            box-shadow 0.1s,
            transform 0.1s;
    }

    .choice:active {
        cursor: grabbing;
    }

    .ready-mode .choice {
        cursor: pointer;
    }

    .ready-mode .choice:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    }

    /*
     * Effet de clic pendant 0,5 seconde
     */
    .choice.clicked {
        background: #90ee90;
        border-color: #198754;
        transform: scale(0.96);
    }

    /*
     * Choix temporairement bloqué
     */
    .choice.blocked {
        cursor: not-allowed;
    }

    .choice-name {
        font-size: 18px;
        font-weight: bold;
        word-break: break-word;
    }

    .counter {
        display: none;
        margin-top: 10px;
        font-size: 26px;
        font-weight: bold;
        color: #6f42c1;
    }

    .show-results .counter {
        display: block;
    }

    .winner {
        border-color: #ffc107;
        background: #fff8dc;
        box-shadow:
            0 0 0 5px #ffc107,
            0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .winner::after {
        content: "🏆";
        position: absolute;
        top: -20px;
        right: -15px;
        font-size: 32px;
    }

    #emptyMessage {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
        font-size: 18px;
    }

    @media (max-width: 600px) {

        #board {
            min-height: 500px;
        }

        .choice {
            width: 140px;
            min-height: 90px;
        }

        .controls {
            flex-direction: column;
        }

        .controls button {
            width: 100%;
        }
    }
</style>


</head>

<body>

<header>
    <h1>🎯 Compteur de choix</h1>
</header>

<!-- ============================================================
     AJOUTER UN CHOIX
     ============================================================ -->

<div class="add-choice">


<input
    type="text"
    id="choiceInput"
    placeholder="Nom du choix..."
    maxlength="100"
>

<button id="addButton">
    ➕ Ajouter
</button>


</div>

<!-- ============================================================
     BOUTONS
     ============================================================ -->

<div class="controls">


<button id="readyButton">
    ✓ Prêt
</button>

<button id="editButton">
    ✏️ Modifier
</button>

<button id="restartButton">
    🔄 Recommencer
</button>

<button id="resultsButton">
    🏆 Afficher les résultats
</button>

<button id="saveButton">
    💾 Enregistrer
</button>

<button id="loadButton">
    📂 Remettre
</button>

<button id="resetButton">
    🗑️ Reset
</button>


</div>

<div id="status">
    Mode modification : ajoute et déplace tes choix.
</div>

<!-- ============================================================
     ZONE DE TRAVAIL
     ============================================================ -->

<div id="board">


<div id="emptyMessage">
    Ajoute un choix pour commencer.
</div>


</div>

<script>

    /*
     * ============================================================
     * VARIABLES
     * ============================================================
     */

    const board =
        document.getElementById("board");

    const choiceInput =
        document.getElementById("choiceInput");

    const addButton =
        document.getElementById("addButton");

    const readyButton =
        document.getElementById("readyButton");

    const editButton =
        document.getElementById("editButton");

    const restartButton =
        document.getElementById("restartButton");

    const resultsButton =
        document.getElementById("resultsButton");

    const saveButton =
        document.getElementById("saveButton");

    const loadButton =
        document.getElementById("loadButton");

    const resetButton =
        document.getElementById("resetButton");

    const status =
        document.getElementById("status");

    const emptyMessage =
        document.getElementById("emptyMessage");


    /*
     * ============================================================
     * CONFIGURATION DE LA SAUVEGARDE
     * ============================================================
     */

    const STORAGE_KEY =
        "compteur_choix_sauvegarde";


    /*
     * ============================================================
     * ÉTAT DE L'APPLICATION
     * ============================================================
     */

    let choices = [];

    let nextId = 1;

    let mode = "edit";

    let showingResults = false;


    /*
     * ============================================================
     * AJOUTER UN CHOIX
     * ============================================================
     */

    function addChoice() {

        const name =
            choiceInput.value.trim();


        if (name === "") {

            choiceInput.focus();

            return;
        }


        const offset =
            choices.length * 30;


        const choice = {

            id: nextId++,

            name: name,

            score: 0,

            x: 30 + (offset % 500),

            y: 30 + (offset % 300),

            blocked: false,

            winner: false

        };


        choices.push(choice);

        choiceInput.value = "";

        showingResults = false;

        render();

        choiceInput.focus();

    }


    /*
     * ============================================================
     * AFFICHER LES CHOIX
     * ============================================================
     */

    function render() {

        board
            .querySelectorAll(".choice")
            .forEach(
                element =>
                    element.remove()
            );


        if (choices.length === 0) {

            emptyMessage.style.display =
                "block";

        } else {

            emptyMessage.style.display =
                "none";

        }


        board.classList.toggle(
            "ready-mode",
            mode === "ready"
        );


        board.classList.toggle(
            "show-results",
            showingResults
        );


        choices.forEach(
            choice => {

                const element =
                    document.createElement("div");


                element.className =
                    "choice";


                element.dataset.id =
                    choice.id;


                element.style.left =
                    choice.x + "px";


                element.style.top =
                    choice.y + "px";


                if (choice.blocked) {

                    element.classList.add(
                        "blocked"
                    );

                }


                /*
                 * =================================================
                 * NOM
                 * =================================================
                 */

                const name =
                    document.createElement("div");

                name.className =
                    "choice-name";

                name.textContent =
                    choice.name;


                /*
                 * =================================================
                 * COMPTEUR
                 * =================================================
                 */

                const counter =
                    document.createElement("div");

                counter.className =
                    "counter";

                counter.textContent =
                    choice.score;


                element.appendChild(name);

                element.appendChild(counter);


                /*
                 * =================================================
                 * GAGNANT
                 * =================================================
                 */

                if (
                    showingResults &&
                    choice.winner
                ) {

                    element.classList.add(
                        "winner"
                    );

                }


                /*
                 * =================================================
                 * CLIC SUR UN CHOIX
                 * =================================================
                 */

                element.addEventListener(
                    "click",
                    function() {

                        /*
                         * En mode modification,
                         * les clics ne comptent pas.
                         */

                        if (mode !== "ready") {

                            return;

                        }


                        /*
                         * Protection contre le double clic.
                         */

                        if (choice.blocked) {

                            return;

                        }


                        /*
                         * Bloquer immédiatement.
                         */

                        choice.blocked = true;


                        /*
                         * Ajouter un point.
                         */

                        choice.score++;


                        /*
                         * Les anciens résultats
                         * ne sont plus valides.
                         */

                        showingResults = false;


                        choices.forEach(
                            c =>
                                c.winner = false
                        );


                        /*
                         * Effet visuel.
                         */

                        element.classList.add(
                            "clicked"
                        );


                        /*
                         * Mise à jour immédiate
                         * du compteur.
                         */

                        counter.textContent =
                            choice.score;


                        /*
                         * Après 0,5 seconde,
                         * le choix redevient cliquable.
                         */

                        setTimeout(
                            function() {

                                choice.blocked =
                                    false;

                                element.classList.remove(
                                    "clicked"
                                );

                            },
                            500
                        );

                    }
                );


                /*
                 * Déplacement
                 */

                enableDragging(
                    element,
                    choice
                );


                board.appendChild(
                    element
                );

            }
        );

    }


    /*
     * ============================================================
     * DÉPLACEMENT DES CHOIX
     * ============================================================
     */

    function enableDragging(
        element,
        choice
    ) {

        /*
         * Impossible de déplacer
         * en mode prêt.
         */

        if (mode !== "edit") {

            return;

        }


        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;


        element.addEventListener(
            "pointerdown",
            function(event) {

                if (mode !== "edit") {

                    return;

                }


                dragging = true;


                const rect =
                    element.getBoundingClientRect();


                offsetX =
                    event.clientX -
                    rect.left;


                offsetY =
                    event.clientY -
                    rect.top;


                element.setPointerCapture(
                    event.pointerId
                );

            }
        );


        element.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging) {

                    return;

                }


                const boardRect =
                    board.getBoundingClientRect();


                const elementWidth =
                    element.offsetWidth;


                const elementHeight =
                    element.offsetHeight;


                let newX =
                    event.clientX -
                    boardRect.left -
                    offsetX;


                let newY =
                    event.clientY -
                    boardRect.top -
                    offsetY;


                const maxX =
                    board.clientWidth -
                    elementWidth;


                const maxY =
                    board.clientHeight -
                    elementHeight;


                newX =
                    Math.max(
                        0,
                        Math.min(
                            newX,
                            maxX
                        )
                    );


                newY =
                    Math.max(
                        0,
                        Math.min(
                            newY,
                            maxY
                        )
                    );


                choice.x =
                    newX;

                choice.y =
                    newY;


                element.style.left =
                    newX + "px";


                element.style.top =
                    newY + "px";

            }
        );


        element.addEventListener(
            "pointerup",
            function(event) {

                dragging = false;


                try {

                    element.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {

                    // Rien à faire

                }

            }
        );


        element.addEventListener(
            "pointercancel",
            function() {

                dragging = false;

            }
        );

    }


    /*
     * ============================================================
     * ENREGISTRER
     * ============================================================
     */

    function saveData() {

        const data = {

            choices: choices,

            nextId: nextId

        };


        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );


            status.textContent =
                "💾 Les choix ont été enregistrés.";

        } catch (error) {

            console.error(
                "Erreur de sauvegarde :",
                error
            );


            status.textContent =
                "❌ Impossible d'enregistrer les choix.";

        }

    }


    /*
     * ============================================================
     * REMETTRE LA SAUVEGARDE
     * ============================================================
     */

    function loadData() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (!saved) {

                status.textContent =
                    "Aucune sauvegarde trouvée.";

                return;

            }


            const data =
                JSON.parse(saved);


            if (
                !data ||
                !Array.isArray(data.choices)
            ) {

                status.textContent =
                    "❌ La sauvegarde est invalide.";

                return;

            }


            /*
             * Restaurer les choix.
             */

            choices =
                data.choices;


            /*
             * Sécurité :
             * les choix remis ne doivent jamais
             * rester bloqués.
             */

            choices.forEach(
                choice => {

                    choice.blocked = false;

                    choice.winner = false;

                }
            );


            nextId =
                Number(data.nextId) ||
                (
                    choices.length + 1
                );


            showingResults =
                false;


            /*
             * On remet en mode modification
             * afin de permettre de vérifier
             * la disposition.
             */

            mode = "edit";


            render();


            status.textContent =
                "📂 La sauvegarde a été remise.";

        } catch (error) {

            console.error(
                "Erreur de chargement :",
                error
            );


            status.textContent =
                "❌ Impossible de remettre la sauvegarde.";

        }

    }


    /*
     * ============================================================
     * RESET COMPLET
     * ============================================================
     */

    function resetEverything() {

        /*
         * Demander une confirmation.
         */

        const confirmed =
            confirm(
                "⚠️ RESET COMPLET\n\n" +
                "Cette action va supprimer :\n\n" +
                "• tous les choix\n" +
                "• tous les compteurs\n" +
                "• toutes les positions\n" +
                "• la sauvegarde enregistrée\n\n" +
                "Cette action est irréversible.\n\n" +
                "Voulez-vous vraiment continuer ?"
            );


        /*
         * L'utilisateur a annulé.
         */

        if (!confirmed) {

            return;

        }


        /*
         * Tout effacer.
         */

        choices = [];

        nextId = 1;

        mode = "edit";

        showingResults = false;


        /*
         * Supprimer la sauvegarde.
         */

        localStorage.removeItem(
            STORAGE_KEY
        );


        /*
         * Rafraîchir l'affichage.
         */

        render();


        status.textContent =
            "🗑️ Tout a été réinitialisé.";

    }


    /*
     * ============================================================
     * PRÊT
     * ============================================================
     */

    readyButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {

                alert(
                    "Ajoute au moins un choix avant de commencer."
                );

                return;

            }


            mode = "ready";

            showingResults = false;


            choices.forEach(
                choice => {

                    choice.winner = false;

                    choice.blocked = false;

                }
            );


            status.textContent =
                "Mode prêt : clique sur un choix pour lui ajouter 1 point.";


            render();

        }
    );


    /*
     * ============================================================
     * MODIFIER
     * ============================================================
     */

    editButton.addEventListener(
        "click",
        function() {

            mode = "edit";

            showingResults = false;


            choices.forEach(
                choice => {

                    choice.winner = false;

                    choice.blocked = false;

                }
            );


            status.textContent =
                "Mode modification : tu peux déplacer les choix et en ajouter.";


            render();

        }
    );


    /*
     * ============================================================
     * RECOMMENCER
     * ============================================================
     */

    restartButton.addEventListener(
        "click",
        function() {

            choices.forEach(
                choice => {

                    choice.score = 0;

                    choice.winner = false;

                    choice.blocked = false;

                }
            );


            showingResults = false;


            /*
             * Les choix restent exactement
             * où ils étaient.
             */

            mode = "ready";


            status.textContent =
                "Nouvelle partie : clique sur les choix pour compter les points.";


            render();

        }
    );


    /*
     * ============================================================
     * RÉSULTATS
     * ============================================================
     */

    resultsButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {

                return;

            }


            let highestScore = 0;


            choices.forEach(
                choice => {

                    if (
                        choice.score >
                        highestScore
                    ) {

                        highestScore =
                            choice.score;

                    }

                }
            );


            choices.forEach(
                choice => {

                    choice.winner =
                        choice.score ===
                        highestScore;

                }
            );


            showingResults = true;


            if (highestScore === 0) {

                status.textContent =
                    "Résultats : aucun point n'a encore été attribué.";

            } else {

                status.textContent =
                    "Résultats affichés !";

            }


            render();

        }
    );


    /*
     * ============================================================
     * BOUTON ENREGISTRER
     * ============================================================
     */

    saveButton.addEventListener(
        "click",
        saveData
    );


    /*
     * ============================================================
     * BOUTON REMETTRE
     * ============================================================
     */

    loadButton.addEventListener(
        "click",
        loadData
    );


    /*
     * ============================================================
     * BOUTON RESET
     * ============================================================
     */

    resetButton.addEventListener(
        "click",
        resetEverything
    );


    /*
     * ============================================================
     * BOUTON AJOUTER
     * ============================================================
     */

    addButton.addEventListener(
        "click",
        addChoice
    );


    /*
     * ============================================================
     * ENTER = AJOUTER
     * ============================================================
     */

    choiceInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addChoice();

            }

        }
    );


    /*
     * ============================================================
     * INITIALISATION
     * ============================================================
     */

    render();

</script>

</body>
</html>
