<body>

<header>
    <h1>🎯 Compteur de choix</h1>
</header>

<!-- Ajouter un choix -->

<div class="add-choice">

```
<input
    type="text"
    id="choiceInput"
    placeholder="Nom du choix..."
    maxlength="100"
>

<button id="addButton">
    ➕ Ajouter
</button>
```

</div>

<!-- Boutons de contrôle -->

<div class="controls">

```
<button id="readyButton">
    ✓ Prêt
</button>

<button id="editButton">
    ✏️ Modifier
</button>

<button id="restartButton">
    🔄 Recommencer
</button>

<button id="resultsButton">
    🏆 Afficher les résultats
</button>
```

</div>

<div id="status">
    Mode modification : ajoute et déplace tes choix.
</div>

<!-- Zone de travail -->

<div id="board">

```
<div id="emptyMessage">
    Ajoute un choix pour commencer.
</div>
```

</div>

<script>

    /*
     * ============================================================
     * VARIABLES
     * ============================================================
     */

    const board = document.getElementById("board");

    const choiceInput =
        document.getElementById("choiceInput");

    const addButton =
        document.getElementById("addButton");

    const readyButton =
        document.getElementById("readyButton");

    const editButton =
        document.getElementById("editButton");

    const restartButton =
        document.getElementById("restartButton");

    const resultsButton =
        document.getElementById("resultsButton");

    const status =
        document.getElementById("status");

    const emptyMessage =
        document.getElementById("emptyMessage");


    /*
     * Liste des choix
     *
     * Exemple :
     *
     * [
     *     {
     *         id: 1,
     *         name: "Pizza",
     *         score: 4,
     *         x: 100,
     *         y: 50
     *     }
     * ]
     */

    let choices = [];

    let nextId = 1;

    /*
     * Deux modes :
     *
     * "edit"  = on peut déplacer les encadrés
     * "ready" = les clics donnent des points
     */

    let mode = "edit";

    let showingResults = false;


    /*
     * ============================================================
     * AJOUTER UN CHOIX
     * ============================================================
     */

    function addChoice() {

        const name =
            choiceInput.value.trim();

        if (name === "") {
            choiceInput.focus();
            return;
        }

        /*
         * Position initiale de l'encadré.
         *
         * On décale chaque nouveau choix
         * pour éviter qu'ils soient exactement
         * l'un par-dessus l'autre.
         */

        const offset =
            choices.length * 30;

        const choice = {

            id: nextId++,

            name: name,

            score: 0,

            x: 30 + (offset % 500),

            y: 30 + (offset % 300)

        };

        choices.push(choice);

        choiceInput.value = "";

        showingResults = false;

        render();

        choiceInput.focus();
    }


    /*
     * ============================================================
     * AFFICHER LES CHOIX
     * ============================================================
     */

    function render() {

        /*
         * Supprimer les anciens encadrés
         */

        board
            .querySelectorAll(".choice")
            .forEach(element => element.remove());


        /*
         * Afficher ou cacher le message
         */

        if (choices.length === 0) {

            emptyMessage.style.display = "block";

        } else {

            emptyMessage.style.display = "none";
        }


        /*
         * Classes générales
         */

        board.classList.toggle(
            "ready-mode",
            mode === "ready"
        );

        board.classList.toggle(
            "show-results",
            showingResults
        );


        /*
         * Créer chaque encadré
         */

        choices.forEach(choice => {

            const element =
                document.createElement("div");

            element.className = "choice";

            element.dataset.id =
                choice.id;

            element.style.left =
                choice.x + "px";

            element.style.top =
                choice.y + "px";


            /*
             * Nom
             */

            const name =
                document.createElement("div");

            name.className =
                "choice-name";

            name.textContent =
                choice.name;


            /*
             * Compteur
             */

            const counter =
                document.createElement("div");

            counter.className =
                "counter";

            counter.textContent =
                choice.score;


            element.appendChild(name);

            element.appendChild(counter);


            /*
             * Gagnant
             */

            if (
                showingResults &&
                choice.winner
            ) {

                element.classList.add("winner");

            }


            /*
             * Mode prêt :
             *
             * un clic ajoute 1 point
             */

            element.addEventListener(
                "click",
                function(event) {

                    /*
                     * En mode modification,
                     * le clic ne fait rien.
                     */

                    if (mode !== "ready") {
                        return;
                    }


                    /*
                     * Ajouter un point
                     */

                    choice.score++;

                    /*
                     * Les résultats disparaissent
                     * dès qu'on recommence à compter.
                     */

                    showingResults = false;

                    choices.forEach(
                        c => c.winner = false
                    );

                    render();

                }
            );


            /*
             * Déplacement
             */

            enableDragging(
                element,
                choice
            );


            board.appendChild(element);

        });

    }


    /*
     * ============================================================
     * DÉPLACEMENT DES ENCADRÉS
     * ============================================================
     */

    function enableDragging(
        element,
        choice
    ) {

        /*
         * Impossible de déplacer
         * en mode prêt.
         */

        if (mode !== "edit") {
            return;
        }


        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;


        element.addEventListener(
            "pointerdown",
            function(event) {

                if (mode !== "edit") {
                    return;
                }

                dragging = true;

                const rect =
                    element.getBoundingClientRect();

                offsetX =
                    event.clientX - rect.left;

                offsetY =
                    event.clientY - rect.top;


                element.setPointerCapture(
                    event.pointerId
                );

            }
        );


        element.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging) {
                    return;
                }

                const boardRect =
                    board.getBoundingClientRect();

                const elementWidth =
                    element.offsetWidth;

                const elementHeight =
                    element.offsetHeight;


                let newX =
                    event.clientX -
                    boardRect.left -
                    offsetX;

                let newY =
                    event.clientY -
                    boardRect.top -
                    offsetY;


                /*
                 * Empêcher l'encadré
                 * de sortir de la zone.
                 */

                const maxX =
                    board.clientWidth -
                    elementWidth;

                const maxY =
                    board.clientHeight -
                    elementHeight;


                newX =
                    Math.max(
                        0,
                        Math.min(newX, maxX)
                    );

                newY =
                    Math.max(
                        0,
                        Math.min(newY, maxY)
                    );


                choice.x = newX;

                choice.y = newY;


                element.style.left =
                    newX + "px";

                element.style.top =
                    newY + "px";

            }
        );


        element.addEventListener(
            "pointerup",
            function(event) {

                dragging = false;

                try {

                    element.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {

                    // Rien à faire

                }

            }
        );


        element.addEventListener(
            "pointercancel",
            function() {

                dragging = false;

            }
        );

    }


    /*
     * ============================================================
     * BOUTON PRÊT
     * ============================================================
     */

    readyButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {

                alert(
                    "Ajoute au moins un choix avant de commencer."
                );

                return;
            }


            mode = "ready";

            showingResults = false;

            choices.forEach(
                choice =>
                    choice.winner = false
            );


            status.textContent =
                "Mode prêt : clique sur un choix pour lui ajouter 1 point.";

            render();

        }
    );


    /*
     * ============================================================
     * BOUTON MODIFIER
     * ============================================================
     */

    editButton.addEventListener(
        "click",
        function() {

            mode = "edit";

            showingResults = false;

            choices.forEach(
                choice =>
                    choice.winner = false
            );


            status.textContent =
                "Mode modification : tu peux déplacer les choix et en ajouter.";

            render();

        }
    );


    /*
     * ============================================================
     * BOUTON RECOMMENCER
     * ============================================================
     */

    restartButton.addEventListener(
        "click",
        function() {

            choices.forEach(
                choice => {

                    choice.score = 0;

                    choice.winner = false;

                }
            );


            showingResults = false;

            /*
             * On reste en mode prêt.
             *
             * Les encadrés ne bougent donc pas.
             */

            mode = "ready";


            status.textContent =
                "Nouvelle partie : clique sur les choix pour compter les points.";

            render();

        }
    );


    /*
     * ============================================================
     * AFFICHER LES RÉSULTATS
     * ============================================================
     */

    resultsButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {
                return;
            }


            /*
             * Chercher le score maximum
             */

            let highestScore = 0;

            choices.forEach(
                choice => {

                    if (
                        choice.score >
                        highestScore
                    ) {

                        highestScore =
                            choice.score;

                    }

                }
            );


            /*
             * Marquer tous les choix
             * qui ont le meilleur score.
             *
             * Il peut donc y avoir
             * plusieurs gagnants en cas d'égalité.
             */

            choices.forEach(
                choice => {

                    choice.winner =
                        choice.score ===
                        highestScore;

                }
            );


            showingResults = true;


            if (highestScore === 0) {

                status.textContent =
                    "Résultats : aucun point n'a encore été attribué.";

            } else {

                status.textContent =
                    "Résultats affichés !";

            }


            render();

        }
    );


    /*
     * ============================================================
     * BOUTON AJOUTER
     * ============================================================
     */

    addButton.addEventListener(
        "click",
        addChoice
    );


    /*
     * ENTER DANS LE CHAMP
     * = AJOUTER
     */

    choiceInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addChoice();

            }

        }
    );


    /*
     * ============================================================
     * INITIALISATION
     * ============================================================
     */

    render();

</script>

</body>
</html>
