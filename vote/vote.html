<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur de choix</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #222;
    }

    header {
        background: #222;
        color: white;
        padding: 15px 20px;
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 24px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        background: white;
        border-bottom: 1px solid #ddd;
        justify-content: center;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 18px;
        font-size: 15px;
        cursor: pointer;
        background: #444;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    #readyButton {
        background: #198754;
    }

    #editButton {
        background: #0d6efd;
    }

    #restartButton {
        background: #dc3545;
    }

    #resultsButton {
        background: #6f42c1;
    }

    .add-choice {
        display: flex;
        gap: 8px;
        padding: 15px;
        background: white;
        justify-content: center;
    }

    #choiceInput {
        width: 300px;
        max-width: 70%;
        padding: 11px;
        border: 1px solid #bbb;
        border-radius: 8px;
        font-size: 16px;
    }

    #addButton {
        background: #198754;
    }

    #status {
        text-align: center;
        padding: 10px;
        font-weight: bold;
    }

    #board {
        position: relative;
        margin: 15px;
        min-height: 600px;

        background:
            linear-gradient(#ddd 1px, transparent 1px),
            linear-gradient(90deg, #ddd 1px, transparent 1px);

        background-size: 25px 25px;

        border: 2px solid #aaa;
        border-radius: 10px;
        overflow: hidden;
    }

    .choice {
        position: absolute;

        width: 170px;
        min-height: 100px;

        padding: 15px;

        background: white;
        border: 3px solid #555;
        border-radius: 12px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        user-select: none;
        cursor: grab;

        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);

        transition:
            background-color 0.1s,
            border-color 0.1s,
            box-shadow 0.1s,
            transform 0.1s;
    }

    .choice:active {
        cursor: grabbing;
    }

    .ready-mode .choice {
        cursor: pointer;
    }

    .ready-mode .choice:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    }

    /*
     * ========================================================
     * EFFET VISUEL LORS D'UN CLIC
     * ========================================================
     *
     * Cette classe est ajoutée pendant 0,5 seconde.
     */

    .choice.clicked {
        background: #90ee90;
        border-color: #198754;
        transform: scale(0.96);
    }

    /*
     * Pendant le blocage de 0,5 seconde,
     * le curseur indique que le bouton est temporairement
     * indisponible.
     */

    .choice.blocked {
        cursor: not-allowed;
    }

    .choice-name {
        font-size: 18px;
        font-weight: bold;
        word-break: break-word;
    }

    .counter {
        display: none;
        margin-top: 10px;
        font-size: 26px;
        font-weight: bold;
        color: #6f42c1;
    }

    .show-results .counter {
        display: block;
    }

    .winner {
        border-color: #ffc107;
        background: #fff8dc;
        box-shadow:
            0 0 0 5px #ffc107,
            0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .winner::after {
        content: "🏆";
        position: absolute;
        top: -20px;
        right: -15px;
        font-size: 32px;
    }

    #emptyMessage {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
        font-size: 18px;
    }

    @media (max-width: 600px) {

        #board {
            min-height: 500px;
        }

        .choice {
            width: 140px;
            min-height: 90px;
        }

        .controls {
            flex-direction: column;
        }

        .controls button {
            width: 100%;
        }
    }
</style>


</head>

<body>

<header>
    <h1>🎯 Compteur de choix</h1>
</header>

<div class="add-choice">


<input
    type="text"
    id="choiceInput"
    placeholder="Nom du choix..."
    maxlength="100"
>

<button id="addButton">
    ➕ Ajouter
</button>


</div>

<div class="controls">


<button id="readyButton">
    ✓ Prêt
</button>

<button id="editButton">
    ✏️ Modifier
</button>

<button id="restartButton">
    🔄 Recommencer
</button>

<button id="resultsButton">
    🏆 Afficher les résultats
</button>


</div>

<div id="status">
    Mode modification : ajoute et déplace tes choix.
</div>

<div id="board">


<div id="emptyMessage">
    Ajoute un choix pour commencer.
</div>


</div>

<script>

    /*
     * ============================================================
     * VARIABLES
     * ============================================================
     */

    const board =
        document.getElementById("board");

    const choiceInput =
        document.getElementById("choiceInput");

    const addButton =
        document.getElementById("addButton");

    const readyButton =
        document.getElementById("readyButton");

    const editButton =
        document.getElementById("editButton");

    const restartButton =
        document.getElementById("restartButton");

    const resultsButton =
        document.getElementById("resultsButton");

    const status =
        document.getElementById("status");

    const emptyMessage =
        document.getElementById("emptyMessage");


    /*
     * ============================================================
     * ÉTAT DE L'APPLICATION
     * ============================================================
     */

    let choices = [];

    let nextId = 1;

    let mode = "edit";

    let showingResults = false;


    /*
     * ============================================================
     * AJOUTER UN CHOIX
     * ============================================================
     */

    function addChoice() {

        const name =
            choiceInput.value.trim();

        if (name === "") {

            choiceInput.focus();

            return;
        }


        const offset =
            choices.length * 30;


        const choice = {

            id: nextId++,

            name: name,

            score: 0,

            x: 30 + (offset % 500),

            y: 30 + (offset % 300),

            /*
             * Bloqueur individuel.
             *
             * false = le choix peut être cliqué
             * true  = le choix est temporairement bloqué
             */

            blocked: false,

            winner: false

        };


        choices.push(choice);

        choiceInput.value = "";

        showingResults = false;

        render();

        choiceInput.focus();

    }


    /*
     * ============================================================
     * AFFICHER LES CHOIX
     * ============================================================
     */

    function render() {

        board
            .querySelectorAll(".choice")
            .forEach(
                element =>
                    element.remove()
            );


        if (choices.length === 0) {

            emptyMessage.style.display =
                "block";

        } else {

            emptyMessage.style.display =
                "none";

        }


        board.classList.toggle(
            "ready-mode",
            mode === "ready"
        );


        board.classList.toggle(
            "show-results",
            showingResults
        );


        choices.forEach(
            choice => {

                const element =
                    document.createElement("div");


                element.className =
                    "choice";


                element.dataset.id =
                    choice.id;


                element.style.left =
                    choice.x + "px";


                element.style.top =
                    choice.y + "px";


                /*
                 * Si ce choix est temporairement bloqué,
                 * on ajoute la classe visuelle.
                 */

                if (choice.blocked) {

                    element.classList.add(
                        "blocked"
                    );

                }


                /*
                 * Nom
                 */

                const name =
                    document.createElement("div");

                name.className =
                    "choice-name";

                name.textContent =
                    choice.name;


                /*
                 * Compteur
                 */

                const counter =
                    document.createElement("div");

                counter.className =
                    "counter";

                counter.textContent =
                    choice.score;


                element.appendChild(name);

                element.appendChild(counter);


                /*
                 * Gagnant
                 */

                if (
                    showingResults &&
                    choice.winner
                ) {

                    element.classList.add(
                        "winner"
                    );

                }


                /*
                 * =================================================
                 * CLIC SUR UN CHOIX
                 * =================================================
                 */

                element.addEventListener(
                    "click",
                    function() {

                        /*
                         * Pas de comptage en mode modification.
                         */

                        if (mode !== "ready") {

                            return;

                        }


                        /*
                         * LE BLOQUEUR
                         *
                         * Si le choix vient d'être cliqué,
                         * on ignore le nouveau clic.
                         */

                        if (choice.blocked) {

                            return;

                        }


                        /*
                         * Bloquer immédiatement.
                         */

                        choice.blocked = true;


                        /*
                         * Ajouter 1 point.
                         */

                        choice.score++;


                        /*
                         * Effacer les résultats précédents.
                         */

                        showingResults = false;


                        choices.forEach(
                            c =>
                                c.winner = false
                        );


                        /*
                         * =================================================
                         * EFFET VISUEL
                         * =================================================
                         *
                         * On change temporairement la couleur
                         * de l'encadré.
                         */

                        element.classList.add(
                            "clicked"
                        );


                        /*
                         * On ne fait PAS render()
                         * ici immédiatement.
                         *
                         * Cela permet de conserver
                         * l'effet visuel.
                         */

                        /*
                         * Après 500 ms :
                         *
                         * - enlever la couleur
                         * - débloquer le choix
                         */

                        setTimeout(
                            function() {

                                choice.blocked =
                                    false;

                                element.classList.remove(
                                    "clicked"
                                );

                            },
                            500
                        );


                        /*
                         * Mettre à jour uniquement
                         * le compteur affiché.
                         */

                        counter.textContent =
                            choice.score;

                    }
                );


                /*
                 * Déplacement
                 */

                enableDragging(
                    element,
                    choice
                );


                board.appendChild(
                    element
                );

            }
        );

    }


    /*
     * ============================================================
     * DÉPLACEMENT
     * ============================================================
     */

    function enableDragging(
        element,
        choice
    ) {

        if (mode !== "edit") {

            return;

        }


        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;


        element.addEventListener(
            "pointerdown",
            function(event) {

                if (mode !== "edit") {

                    return;

                }


                dragging = true;


                const rect =
                    element.getBoundingClientRect();


                offsetX =
                    event.clientX -
                    rect.left;


                offsetY =
                    event.clientY -
                    rect.top;


                element.setPointerCapture(
                    event.pointerId
                );

            }
        );


        element.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging) {

                    return;

                }


                const boardRect =
                    board.getBoundingClientRect();


                const elementWidth =
                    element.offsetWidth;


                const elementHeight =
                    element.offsetHeight;


                let newX =
                    event.clientX -
                    boardRect.left -
                    offsetX;


                let newY =
                    event.clientY -
                    boardRect.top -
                    offsetY;


                const maxX =
                    board.clientWidth -
                    elementWidth;


                const maxY =
                    board.clientHeight -
                    elementHeight;


                newX =
                    Math.max(
                        0,
                        Math.min(
                            newX,
                            maxX
                        )
                    );


                newY =
                    Math.max(
                        0,
                        Math.min(
                            newY,
                            maxY
                        )
                    );


                choice.x = newX;

                choice.y = newY;


                element.style.left =
                    newX + "px";


                element.style.top =
                    newY + "px";

            }
        );


        element.addEventListener(
            "pointerup",
            function(event) {

                dragging = false;


                try {

                    element.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {

                    // Rien à faire

                }

            }
        );


        element.addEventListener(
            "pointercancel",
            function() {

                dragging = false;

            }
        );

    }


    /*
     * ============================================================
     * PRÊT
     * ============================================================
     */

    readyButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {

                alert(
                    "Ajoute au moins un choix avant de commencer."
                );

                return;

            }


            mode = "ready";

            showingResults = false;


            choices.forEach(
                choice =>
                    choice.winner = false
            );


            status.textContent =
                "Mode prêt : clique sur un choix pour lui ajouter 1 point.";


            render();

        }
    );


    /*
     * ============================================================
     * MODIFIER
     * ============================================================
     */

    editButton.addEventListener(
        "click",
        function() {

            mode = "edit";

            showingResults = false;


            choices.forEach(
                choice => {

                    choice.winner = false;

                    /*
                     * Si un choix était bloqué,
                     * on le débloque en mode modification.
                     */

                    choice.blocked = false;

                }
            );


            status.textContent =
                "Mode modification : tu peux déplacer les choix et en ajouter.";


            render();

        }
    );


    /*
     * ============================================================
     * RECOMMENCER
     * ============================================================
     */

    restartButton.addEventListener(
        "click",
        function() {

            choices.forEach(
                choice => {

                    choice.score = 0;

                    choice.winner = false;

                    choice.blocked = false;

                }
            );


            showingResults = false;

            /*
             * On reste en mode prêt.
             */

            mode = "ready";


            status.textContent =
                "Nouvelle partie : clique sur les choix pour compter les points.";


            render();

        }
    );


    /*
     * ============================================================
     * RÉSULTATS
     * ============================================================
     */

    resultsButton.addEventListener(
        "click",
        function() {

            if (choices.length === 0) {

                return;

            }


            let highestScore = 0;


            choices.forEach(
                choice => {

                    if (
                        choice.score >
                        highestScore
                    ) {

                        highestScore =
                            choice.score;

                    }

                }
            );


            choices.forEach(
                choice => {

                    choice.winner =
                        choice.score ===
                        highestScore;

                }
            );


            showingResults = true;


            if (highestScore === 0) {

                status.textContent =
                    "Résultats : aucun point n'a encore été attribué.";

            } else {

                status.textContent =
                    "Résultats affichés !";

            }


            render();

        }
    );


    /*
     * ============================================================
     * AJOUTER
     * ============================================================
     */

    addButton.addEventListener(
        "click",
        addChoice
    );


    /*
     * ENTER = AJOUTER
     */

    choiceInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addChoice();

            }

        }
    );


    /*
     * ============================================================
     * INITIALISATION
     * ============================================================
     */

    render();

</script>

</body>
</html>
